<!DOCTYPE html>
<html>
<head>
  <title>YourFavGames</title>

  <style>
    body {
      margin: 0;
      background: #141414;
      color: white;
      font-family: Arial;
    }

    header {
      display: flex;
      justify-content: space-between;
      padding: 15px 30px;
      background: black;
      align-items: center;
    }

    input {
      padding: 8px;
      border-radius: 5px;
      border: none;
    }

    .row {
      margin: 20px;
    }

    .category-title {
      margin: 20px 0 10px;
      font-size: 20px;
      color: #ff3b3b;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    .game {
      width: 200px;
      height: 120px;
      position: relative;
      cursor: pointer;
      transition: 0.2s;
    }

    .game:hover {
      transform: scale(1.05);
      z-index: 5;
    }

    .game img {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      object-fit: cover;
    }

    .title {
      position: absolute;
      bottom: 5px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 13px;
    }

    /* PLAYER */
    #player {
      position: fixed;
      width: 100%;
      height: 100%;
      background: black;
      top: 0;
      left: 0;
      display: none;
      flex-direction: column;
      z-index: 100;
    }

    #topbar {
      text-align: right;
      padding: 10px;
      background: black;
    }

    iframe {
      flex: 1;
      border: none;
    }

  </style>
</head>

/* 📦 AUTO BUILD UI */
const container = document.getElementById("container");

function buildUI() {
  container.innerHTML = "";

  let categories = [...new Set(games.map(g => g.cat))];

  categories.forEach(cat => {
    let section = document.createElement("div");

    section.innerHTML = `
      <div class="category-title">${cat}</div>
      <div class="grid" id="cat-${cat}"></div>
    `;

    container.appendChild(section);

    let grid = section.querySelector(".grid");

    games
      .filter(g => g.cat === cat)
      .forEach(game => {
        let div = document.createElement("div");
        div.className = "game";
        div.dataset.name = game.name;

        div.innerHTML = `
          <img src="${game.thumb}">
          <div class="title">
            ${game.name} • <span id="count-${game.id}">0</span>
          </div>
        `;

        div.onclick = () => playGame(game.url, game.id);

        grid.appendChild(div);

        /* Firebase live count */
        const countRef = ref(db, "games/" + game.id);
        onValue(countRef, (snap) => {
          document.getElementById("count-" + game.id).textContent = snap.val() || 0;
        });
      });
  });
}

buildUI();

/* 🎮 PLAY */
window.playGame = async function(url, id) {
  currentGame = id;

  const gameRef = ref(db, "games/" + id);
  let snap = await get(gameRef);
  let count = snap.val() || 0;

  await set(gameRef, count + 1);

  document.getElementById("player").style.display = "flex";
  document.getElementById("frame").src = url;
};

/* ❌ CLOSE */
window.closePlayer = async function() {
  if (currentGame) {
    const gameRef = ref(db, "games/" + currentGame);
    let snap = await get(gameRef);
    let count = snap.val() || 0;

    await set(gameRef, Math.max(0, count - 1));
  }

  document.getElementById("player").style.display = "none";
  document.getElementById("frame").src = "";
};

/* 🔍 SEARCH */
document.getElementById("search").addEventListener("input", (e) => {
  let value = e.target.value.toLowerCase();

  document.querySelectorAll(".game").forEach(game => {
    let name = game.dataset.name.toLowerCase();
    game.style.display = name.includes(value) ? "block" : "none";
  });
});

</script>
